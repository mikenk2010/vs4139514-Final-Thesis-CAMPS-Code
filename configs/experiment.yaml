# CAMPS Part B experiment configuration (single source of truth)
seed: 4139514

paths:
  icnale_root: data/          # unzipped ICNALE modules live here (gitignored)
  manifest: results/manifest.csv
  cache: results/cache/
  results: results/

sampling:
  tasks: [PTJ0, SMK0]         # both controlled topics
  bands: [B1_2, B2_0]         # upper proficiency bands
  cohorts:
    sea:    {regions: [THA, IDN, PHL], n: 100}
    native: {regions: [ENS], ens_types: [XX_1], n: 100}   # college students
    mekong_validation: {regions: [VNM, KHM, LAO, MMR], n: 40}  # CRI_Mekong check
  gra: keep_all               # 140 essays, validation set for E3

models:                        # personal API accounts; exact IDs pinned before E1
  # local smoke-test model (free, via Ollama; not part of the official E1 set)
  - {name: qwen3-local, provider: ollama, id: "qwen3:14b"}
  # CONFIRM each id in your own provider console before full E1, then
  # record the final strings in thesis Appendix B.
  - {name: gpt-4o,        provider: openai,    id: "gpt-4o"}                # pilot-family continuity; pin dated snapshot if console offers one
  - {name: claude-sonnet, provider: anthropic, id: "claude-sonnet-4-6"}
  # Gemini via the official API (ProxyPal's free route was discontinued
  # by Google mid-experiment; access switch recorded for Appendix B).
  # SAME model id, so scientific identity and the cache are preserved.
  - {name: gemini-pro,    provider: google,    id: "gemini-3.1-pro-preview"}
  - {name: llama-70b,     provider: together,  id: "meta-llama/Llama-3.3-70B-Instruct-Turbo"}

generation:
  temperature: 0.0
  response_format: json
  max_retries: 5

conditions:
  baseline:  {agents: [neutral_single]}                # single-agent standard rubric
  camps_k3:  {agents: [western, sea, neutral]}         # pilot configuration
  camps_k5:  {agents: [western, sea, east_asian, mekong, neutral]}
  camps_k5_adj: {agents: [western, sea, east_asian, mekong, neutral],
                 adjudicator: true}

experiments:
  E1: {conditions: [baseline, camps_k3], cohorts: [sea, native]}
  E2: {conditions: [camps_k5, camps_k5_adj], cohorts: [sea, native],
       weight_sweep: {step: 0.05}}
  E3: {conditions: [camps_k5], cohorts: [gra], roc_calibration: true}
